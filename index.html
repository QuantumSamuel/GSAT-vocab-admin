<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- CSP 沿用原站精神（4.0.3）：只允許自身資源；對外只連 Supabase（Auth／REST／RPC）。
       後台不需要 AI 端點，故 connect-src 比原站更窄。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>學測英文單字後台</title>
  <link rel="stylesheet" href="css/admin.css">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="robots" content="noindex, nofollow">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div id="page">
    <div class="chrome-bar">
      <!-- 登入後才顯示右側使用者選單；左側留白維持標籤居中（原站同一個 .chrome-bar 版面） -->
      <div class="left-cluster"></div>
      <div id="top-label"></div>
      <div class="menu-wrap" id="user-wrap" hidden>
        <button id="user-fab" title="使用者" aria-label="使用者">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        </button>
        <nav class="user-menu" id="user-menu"></nav>
      </div>
    </div>
    <main id="app">
      <section class="card"><p class="muted">載入中…</p></section>
    </main>
  </div>
  <footer>學測英文單字後台｜僅限管理員使用｜Designed by 蕭志賢 &amp; Z code</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
